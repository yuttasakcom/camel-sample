camel.main.name = consumer-ddp

# Sync cluster (kafka-sync): override with env, e.g. KAFKA_BROKERS=kafka-sync:29092
kafka.brokers = {{env:KAFKA_BROKERS:localhost:9093}}
kafka.topic = {{env:KAFKA_TOPIC:consumer-ddp}}
kafka.group-id = {{env:KAFKA_GROUP_ID:consumer-ddp-group}}
kafka.auto-offset-reset = earliest
