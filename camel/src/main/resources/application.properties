camel.main.name = camel-transaction-router

# Kafka (override with env, e.g. KAFKA_BROKERS=kafka:29092)
kafka.brokers = {{env:KAFKA_BROKERS:localhost:9092}}
kafka.source-topic = {{env:KAFKA_SOURCE_TOPIC:transaction-logs}}
kafka.target-topic = {{env:KAFKA_TARGET_TOPIC:consumer-ddp}}
kafka.group-id = {{env:KAFKA_GROUP_ID:camel-transaction-router}}
kafka.auto-offset-reset = earliest
