camel.main.name = camel-transaction-router

# Source cluster (kafka): override with env, e.g. KAFKA_SOURCE_BROKERS=kafka:29092
kafka.source-brokers = {{env:KAFKA_SOURCE_BROKERS:localhost:9092}}
kafka.source-topic = {{env:KAFKA_SOURCE_TOPIC:transaction-logs}}
kafka.group-id = {{env:KAFKA_GROUP_ID:camel-transaction-router}}
kafka.auto-offset-reset = earliest

# Sync cluster (kafka-sync): override with env, e.g. KAFKA_TARGET_BROKERS=kafka-sync:29092
kafka.target-brokers = {{env:KAFKA_TARGET_BROKERS:localhost:9093}}
kafka.target-topic = {{env:KAFKA_TARGET_TOPIC:consumer-ddp}}
